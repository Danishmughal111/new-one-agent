# Alembic configuration for AI Company OS.
# The actual database URL is injected in alembic/env.py from application
# settings (DATABASE_URL), so the placeholder below is only a fallback.

[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden at runtime by app.core.config.settings.database_url
sqlalchemy.url = postgresql+asyncpg://ai_company:ai_company_password@localhost:5432/ai_company_os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S